name: Post-deploy verification

# Render deploys on push; this waits for the new commit to go live and
# verifies it. Production = main on MantCib3/probe; everything else = staging.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - name: Verify live deploy
        env:
          ORIGIN: ${{ vars.DEPLOY_ORIGIN || ((github.repository == 'MantCib3/probe' && github.ref_name == 'main') && 'https://usernameprobe.com' || 'https://probe-staging.onrender.com') }}
        run: node scripts/verify-deploy.js "$ORIGIN" "${{ github.sha }}" --timeout-min 25
