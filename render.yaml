services:
  - type: web
    name: probe
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) — do not commit
      # real values here. See SECURITY notes / conversation for details.
      - key: TURNSTILE_SECRET
        sync: false
      # Optional: restricts which frontend hostnames a Turnstile token can
      # claim to come from, once the production domain is live, e.g.
      # "usernameprobe.com,www.usernameprobe.com"
      - key: TURNSTILE_HOSTNAMES
        sync: false
      - key: TRUST_PROXY
        value: "1"   # Render's own edge always proxies to this process
      - key: CF_FRONTED
        sync: false  # set to "1" only if this domain is orange-clouded through Cloudflare
      # Email notifications for /api/contact and /api/report via Resend.
      # Verify the RESEND_FROM domain in Resend before enabling the forms.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_TO
        sync: false
